name: Generate and Post TikTok Video

on:
  schedule:
    # UTC times — 2 runs/day. Adjust to your timezone.
    - cron: "0 6 * * *"   # ~09:30 Tehran time
    - cron: "0 15 * * *"  # ~18:30 Tehran time
  workflow_dispatch: {}    # lets you trigger it manually from the Actions tab

jobs:
  build-and-post:
    runs-on: ubuntu-latest
    timeout-minutes: 120   # generous ceiling; CPU inference can be slow

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Cache pip packages
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: pip-${{ runner.os }}-${{ hashFiles('requirements.txt') }}

      - name: Install ffmpeg
        run: sudo apt-get update && sudo apt-get install -y ffmpeg

      - name: Install Python dependencies
        run: pip install -r requirements.txt

      - name: Generate image
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: python scripts/generate_image.py

      - name: Generate music
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: python scripts/generate_music.py

      - name: Build looping video from image
        run: python scripts/make_loop.py

      - name: Combine loop + music into final video
        run: python scripts/combine.py

      - name: Refresh TikTok token
        env:
          TIKTOK_CLIENT_KEY: ${{ secrets.TIKTOK_CLIENT_KEY }}
          TIKTOK_CLIENT_SECRET: ${{ secrets.TIKTOK_CLIENT_SECRET }}
          TIKTOK_REFRESH_TOKEN: ${{ secrets.TIKTOK_REFRESH_TOKEN }}
          GH_PAT: ${{ secrets.GH_PAT }}
        run: python scripts/refresh_tiktok_token.py

      - name: Upload to TikTok
        run: python scripts/upload_tiktok.py

      - name: Upload artifact for debugging
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: output-${{ github.run_id }}
          path: output/
          retention-days: 3
